spring:
  application:
    name: simulation-service
  datasource:
    url: ${SIMULATION_DB_URL:jdbc:postgresql://localhost:5438/simulation_db}
    username: ${SIMULATION_DB_USER:simulation}
    password: ${SIMULATION_DB_PASSWORD:simulation}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

server:
  # Respeta X-Forwarded-* del gateway: Swagger muestra la dirección pública y no la de la réplica.
  forward-headers-strategy: framework
  port: ${SIMULATION_SERVICE_PORT:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method


eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
    healthcheck:
      enabled: true
  instance:
    # Las réplicas se anuncian por IP: así el gateway las alcanza dentro de la red de Docker.
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.cloud.client.ip-address}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

simulation:
  # Máximo de preguntas de un simulacro.
  max-questions: ${SIMULATION_MAX_QUESTIONS:50}
  # Cada cuánto se cierran los simulacros cuyo tiempo ya se agotó, aunque el estudiante no vuelva.
  expiration-interval-ms: ${SIMULATION_EXPIRATION_INTERVAL_MS:30000}
