# Publica los puertos de cada servicio para llamarlos directamente (sin gateway), por ejemplo para depurar:
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d
# No se puede combinar con --scale: cada servicio ocupa un puerto fijo del equipo.
services:
  user-service:
    ports: ["8081:8081"]
  question-service:
    ports: ["8082:8082"]
  assignment-service:
    ports: ["8083:8083"]
  notification-service:
    ports: ["8084:8084"]
  history-service:
    ports: ["8085:8085"]
  simulation-service:
    ports: ["8086:8086"]
  tracking-service:
    ports: ["8087:8087"]
  email-service:
    ports: ["8090:8090"]
  audit-service:
    ports: ["8091:8091"]
  lifecycle-service:
    ports: ["8094:8094"]
  validation-service:
    ports: ["8095:8095"]
  evaluation-service:
    ports: ["8096:8096"]
