# Balanceador de entrada: reparte entre las réplicas del api-gateway que Docker publica bajo el nombre
# «api-gateway» (docker compose up -d --scale api-gateway=3). Vuelve a resolver el nombre cada pocos segundos, así
# una réplica nueva entra en el reparto y una caída sale sin reiniciar nada.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream gateways {
    zone gateways 64k;
    # Una réplica no se da por caída por un 503 de negocio (por ejemplo, «servicio no disponible» del circuit breaker):
    # solo por no poder conectarse, y por poco tiempo.
    server api-gateway:8080 resolve max_fails=3 fail_timeout=3s;
    # Conexiones persistentes hacia las réplicas: sin ellas cada petición abre una conexión nueva y, con carga,
    # se agotan los puertos del equipo («Address not available»).
    keepalive 256;
    keepalive_requests 100000;
    keepalive_timeout 60s;
}

server {
    listen 8080;
    server_name _;

    location / {
        proxy_pass http://gateways;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        # Si una réplica no responde, se prueba con otra (nginx solo repite lecturas, no escrituras).
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
    }

    location = /edge-health {
        access_log off;
        default_type text/plain;
        return 200 "UP";
    }
}
