openapi: 3.0.3
info:
  title: user-service y notification-service
  version: 0.1.0
  description: |
    Contrato de diseño de los dos servicios pequeños. Cada uno publicará su propio
    contrato; se agrupan aquí por brevedad.
servers:
  - url: http://localhost:8080/api
    description: A través del API Gateway
tags:
  - name: Usuarios
  - name: Notificaciones
paths:
  /auth/login:
    post:
      tags: [Usuarios]
      summary: Iniciar sesión con un usuario precargado. Público.
      description: Devuelve un token firmado con el rol del usuario. En el corte 3 el emisor pasa a ser Keycloak.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, contrasena]
              properties:
                correo: { type: string, format: email }
                contrasena: { type: string, format: password }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiraEn: { type: integer, description: Segundos }
                  usuario: { $ref: '#/components/schemas/User' }
        '401': { description: Credenciales incorrectas }
  /users/me:
    get:
      tags: [Usuarios]
      summary: Datos del usuario autenticado
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /users:
    get:
      tags: [Usuarios]
      summary: Listar usuarios por rol, por ejemplo los revisores elegibles (HU-04). Rol ADMIN.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [ADMIN, AUTHOR, REVIEWER] }
        - name: excludeId
          in: query
          description: Identificador a excluir, normalmente el autor de la pregunta
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Usuarios
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
  /notifications:
    get:
      tags: [Notificaciones]
      summary: Bandeja de notificaciones del usuario autenticado
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: soloNoLeidas, in: query, schema: { type: boolean, default: false } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Notificaciones, las más recientes primero
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
  /notifications/{id}/read:
    patch:
      tags: [Notificaciones]
      summary: Marcar una notificación como leída
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Marcada como leída }
        '404': { description: No existe o no es del usuario }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        correo: { type: string, format: email }
        roles:
          type: array
          items: { type: string, enum: [ADMIN, AUTHOR, REVIEWER] }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        tipo:
          type: string
          enum: [REVISORES_ASIGNADOS, EVALUACION_RECIBIDA, PREGUNTA_APROBADA, PREGUNTA_RECHAZADA]
        asunto: { type: string }
        mensaje: { type: string }
        questionId: { type: string, format: uuid }
        leida: { type: boolean }
        estadoCorreo: { type: string, enum: [PENDIENTE, ENVIADO, FALLIDO] }
        creadaEn: { type: string, format: date-time }
