server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La configuración de direcciones (API y Keycloak) nunca se guarda en caché: se puede cambiar sin recompilar,
    # montando otro config.json sobre este.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # Los archivos compilados llevan un resumen en el nombre: se pueden guardar para siempre.
    location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Cualquier otra ruta es de la aplicación (enrutamiento en el navegador).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
